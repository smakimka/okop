services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser_password
      POSTGRES_DB: parser_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  parser:
    build: .
    depends_on:
      - postgres

volumes:
  postgres_data:
